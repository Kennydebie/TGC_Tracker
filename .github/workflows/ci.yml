name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run extension:build
      - run: npm run build
      - run: npm --prefix workers/scout-mcp-bridge ci
      - run: npm --prefix workers/scout-mcp-bridge run format:check
      - run: npm --prefix workers/scout-mcp-bridge run lint
      - run: npm --prefix workers/scout-mcp-bridge run typecheck
      - run: npm --prefix workers/scout-mcp-bridge test
      - run: npm --prefix workers/scout-mcp-bridge run check
